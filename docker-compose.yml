version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: devpilot
      POSTGRES_PASSWORD: devpilot_secret
      POSTGRES_DB: devpilot_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    depends_on:
      - db
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://devpilot:devpilot_secret@db:5432/devpilot_db

volumes:
  postgres_data:
